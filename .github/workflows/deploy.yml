name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，改为 master

# 添加权限声明
permissions:
  contents: write   # 允许写入仓库内容

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: false  # 我们之前设置过 false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # 使用 Node.js 16，如果你之前遇到 ES Module 问题可以尝试 14

      - name: Install dependencies
        run: npm install

      - name: Generate static files
        run: npm run build  # 确保 package.json 中有 "build": "hexo generate"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # 使用内置 token
          publish_dir: ./public
          publish_branch: gh-pages